name: Python checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: |
          cmp "services/ai_service.py" "Fleta bot/services/ai_service.py"
          cmp "services/prompt_builder.py" "Fleta bot/services/prompt_builder.py"
          cmp "database/database.py" "Fleta bot/database/database.py"
